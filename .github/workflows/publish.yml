name: Build and publish NuGet packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build SemiThemeRecolor.slnx -c Release
      - run: dotnet test tests/Semi.Avalonia.Recolor.Tests/Semi.Avalonia.Recolor.Tests.csproj -c Release

  package:
    name: Pack release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Pack core library
        run: dotnet pack src/Semi.Avalonia.Recolor/Semi.Avalonia.Recolor.csproj -c Release -p:Version="${GITHUB_REF_NAME#v}" -o artifacts/packages
      - name: Pack Ursa integration
        run: dotnet pack src/Semi.Avalonia.Recolor.Ursa/Semi.Avalonia.Recolor.Ursa.csproj -c Release -p:Version="${GITHUB_REF_NAME#v}" -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg

  publish:
    name: Publish to NuGet.org
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Request short-lived NuGet credential
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: zxcdenjir
      - name: Publish packages
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
